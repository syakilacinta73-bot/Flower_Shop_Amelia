<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flower Shop Amelia - Kasir & Katalog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="brand">
      <span class="logo-icon">🌸</span>
      <div>
        <h1>Flower Shop Amelia</h1>
        <p>Sistem Kasir & Katalog Bunga Segar</p>
      </div>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Cari nama bunga atau buket...">
    </div>
  </header>

  <main class="container">
    <section class="catalog-section">
      <div class="filter-bar" id="categoryFilters">
        <button class="filter-btn active" data-category="Semua">Semua</button>
        <button class="filter-btn" data-category="Buket Tangan">Buket Tangan</button>
        <button class="filter-btn" data-category="Bunga Tangkai">Bunga Tangkai</button>
        <button class="filter-btn" data-category="Vas & Pot">Vas & Pot Meja</button>
      </div>

      <div class="product-grid" id="productGrid"></div>
    </section>

    <aside class="cart-section">
      <div class="cart-header">
        <h2>🛒 Keranjang Belanja</h2>
        <button class="btn-clear" id="btnClearCart">Hapus Semua</button>
      </div>

      <div class="cart-items" id="cartItems">
        <p class="empty-msg">Belum ada bunga yang dipilih.</p>
      </div>

      <div class="checkout-box">
        <div class="summary-row total-row">
          <span>Total Bayar</span>
          <span id="totalPrice">Rp 0</span>
        </div>

        <div class="form-group">
          <label for="paymentMethod">Metode Pembayaran</label>
          <select id="paymentMethod">
            <option value="Tunai">Tunai (Cash)</option>
            <option value="QRIS">QRIS</option>
            <option value="Transfer">Transfer Bank</option>
          </select>
        </div>

        <div id="cashSection">
          <div class="form-group">
            <label for="cashInput">Uang Diterima (Rp)</label>
            <input type="number" id="cashInput" placeholder="Masukkan nominal..." min="0">
          </div>

          <div class="quick-cash">
            <button type="button" class="quick-btn" id="btnExactCash">Uang Pas</button>
            <button type="button" class="quick-btn" data-amount="100000">Rp 100.000</button>
            <button type="button" class="quick-btn" data-amount="200000">Rp 200.000</button>
          </div>

          <div class="summary-row change-row">
            <span>Kembalian</span>
            <span id="changeAmount">Rp 0</span>
          </div>
        </div>

        <button class="btn-checkout" id="btnCheckout" disabled>Selesaikan Transaksi</button>
      </div>
    </aside>
  </main>

  <div class="modal-overlay" id="receiptModal">
    <div class="receipt-card">
      <div class="receipt-header">
        <h3>🌸 Flower Shop Amelia</h3>
        <p>Jl. Melati Indah No. 12, Semarang</p>
        <small id="receiptDate"></small>
      </div>
      <hr>
      <div class="receipt-body" id="receiptBody"></div>
      <hr>
      <div class="receipt-footer" id="receiptFooter"></div>
      <div class="receipt-actions">
        <button class="btn-copy" id="btnCopyReceipt">Salin Struk</button>
        <button class="btn-new" id="btnNewTransaction">Transaksi Baru</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
